version: 2.1

executors:
  node22:
    docker:
      - image: cimg/node:22.14
    working_directory: ~/project

jobs:
  live_platform_check:
    executor: node22
    steps:
      - checkout
      - restore_cache:
          keys:
            - live-synesis-npm-v3-{{ arch }}-{{ checksum "package-lock.json" }}
            - live-synesis-npm-v3-{{ arch }}-
      - run:
          name: Install locked LIVE SYNESIS dependencies
          command: npm ci --no-audit --no-fund
      - save_cache:
          key: live-synesis-npm-v3-{{ arch }}-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Run regression, runtime and production build checks
          command: npm run check
      - store_artifacts:
          path: client/dist
          destination: live-synesis-frontend

  model3_check:
    executor: node22
    steps:
      - checkout
      - restore_cache:
          keys:
            - model3-npm-v2-{{ arch }}-{{ checksum "model3/package-lock.json" }}
            - model3-npm-v2-{{ arch }}-
      - run:
          name: Install locked Model 3 dependencies
          command: cd model3 && npm ci --no-audit --no-fund
      - save_cache:
          key: model3-npm-v2-{{ arch }}-{{ checksum "model3/package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Run Model 3 regression and production build
          command: cd model3 && npm run check
      - store_artifacts:
          path: model3/client/dist
          destination: synesis-model3-frontend

workflows:
  live_platform_validate:
    jobs:
      - live_platform_check:
          filters:
            branches:
              only:
                - main

  model3_validate:
    jobs:
      - model3_check:
          filters:
            branches:
              only:
                - synesis-new-model-3.0
