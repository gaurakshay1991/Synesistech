version: 2.1

executors:
  node22:
    docker:
      - image: cimg/node:22.14
    working_directory: ~/project

jobs:
  live_platform_check:
    executor: node22
    steps:
      - checkout
      - restore_cache:
          keys:
            - live-synesis-npm-v2-{{ arch }}-{{ checksum "package-lock.json" }}
            - live-synesis-npm-v2-{{ arch }}-
      - run:
          name: Install LIVE SYNESIS dependencies
          command: npm install --no-audit --no-fund
      - save_cache:
          key: live-synesis-npm-v2-{{ arch }}-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Run regression, governance and runtime checks
          command: npm run check
      - run:
          name: Confirm workforce protection policy is present
          command: |
            test -f HUMAN_OVERSIGHT_POLICY.md
            test -f server/src/governance.js
            test -f server/src/governance-db.js
            grep -q "prohibitedAutonomousEmploymentDecisions" server/src/governance.js
            grep -q "emergencyFallbackMayNotBeCompleted" server/src/governance-db.js
      - store_artifacts:
          path: client/dist
          destination: live-synesis-frontend

  model3_check:
    executor: node22
    steps:
      - checkout
      - restore_cache:
          keys:
            - model3-npm-v1-{{ arch }}-{{ checksum "model3/package.json" }}
            - model3-npm-v1-{{ arch }}-
      - run:
          name: Install Model 3 dependencies
          command: cd model3 && npm install --no-audit --no-fund
      - save_cache:
          key: model3-npm-v1-{{ arch }}-{{ checksum "model3/package.json" }}
          paths:
            - ~/.npm
      - run:
          name: Run Model 3 regression and production build
          command: cd model3 && npm run check
      - store_artifacts:
          path: model3/client/dist
          destination: synesis-model3-frontend

workflows:
  live_platform_validate:
    jobs:
      - live_platform_check:
          filters:
            branches:
              only:
                - main

  model3_validate:
    jobs:
      - model3_check:
          filters:
            branches:
              only:
                - synesis-new-model-3.0
