name: Apply Synesis Neuro-Symbolic v4

on:
  push:
    branches:
      - feature/neuro-symbolic-platform-v4
    paths:
      - "model3/.v4-payload/**"
      - ".github/workflows/apply-neuro-v4.yml"

permissions:
  contents: write

jobs:
  apply-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/neuro-symbolic-platform-v4
          fetch-depth: 0
      - name: Apply verified source payload
        shell: bash
        run: |
          set -euo pipefail
          cat model3/.v4-payload/chunk-* > /tmp/synesis-v4.b64
          base64 --decode /tmp/synesis-v4.b64 > /tmp/synesis-v4.tar.gz
          echo "a7360a2d3ea5d824fb1bee35b73824b8ab3d34040c5a55ccd07afa3bfd18de1e  /tmp/synesis-v4.tar.gz" | sha256sum -c -
          tar -xzf /tmp/synesis-v4.tar.gz -C model3
          rm -rf model3/.v4-payload
          rm -f model3/docs/.build-lock
          rm -f .github/workflows/apply-neuro-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Synesis Neuro-Symbolic Legal Intelligence Platform v4"
          git push origin HEAD:feature/neuro-symbolic-platform-v4
