name: Patch exposure graceful fallback

on:
  push:
    branches: [fix/exposure-graceful-live-overlay]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/exposure-graceful-live-overlay
      - name: Apply focused exposure patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('model3/server/src/live-routes.js')
          s = p.read_text()
          old = """    let authorityResearch = null;
    if (req.body?.live !== false && openai) {
      const material = exposure.exposures.slice(0, 12).map(item => ({ category: item.category, riskLevel: item.riskLevel, issue: item.issue, quantificationStatus: item.quantificationStatus, contractualExposure: item.directContractualExposure })).map(item => JSON.stringify(item)).join('\\n');
      authorityResearch = await liveLegalResearch({
        client: openai,
        model: config.openaiLiveModel,
        question: `Determine the CURRENT statutory, regulatory and enforcement exposure relevant to the material risks below. State current penalty/fine/damages maxima only when a current primary authority supplies them. Distinguish maximum statutory exposure from likely/actual exposure and explain applicability.\\n${material}`,
        jurisdiction: document.jurisdiction,
        document,
        purpose: 'current-authority exposure quantification'
      });
    }
"""
          new = """    let authorityResearch = null;
    if (req.body?.live !== false && openai) {
      const material = exposure.exposures.slice(0, 12).map(item => ({ category: item.category, riskLevel: item.riskLevel, issue: item.issue, quantificationStatus: item.quantificationStatus, contractualExposure: item.directContractualExposure })).map(item => JSON.stringify(item)).join('\\n');
      try {
        authorityResearch = await liveLegalResearch({
          client: openai,
          model: config.openaiLiveModel,
          question: `Determine the CURRENT statutory, regulatory and enforcement exposure relevant to the material risks below. State current penalty/fine/damages maxima only when a current primary authority supplies them. Distinguish maximum statutory exposure from likely/actual exposure and explain applicability.\\n${material}`,
          jurisdiction: document.jurisdiction,
          document,
          purpose: 'current-authority exposure quantification'
        });
      } catch (error) {
        authorityResearch = {
          status: 'Live authority overlay unavailable',
          liveWebUsed: false,
          answer: '',
          citations: [],
          error: String(error.message || error).slice(0, 500),
          researchedAt: new Date().toISOString()
        };
      }
    }
"""
          if old not in s:
              raise SystemExit('target exposure block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/patch-exposure-graceful.yml
          git config user.name "synesis-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add model3/server/src/live-routes.js .github/workflows/patch-exposure-graceful.yml
          git commit -m "Keep contractual exposure available when live authority research fails"
          git push origin HEAD:fix/exposure-graceful-live-overlay
