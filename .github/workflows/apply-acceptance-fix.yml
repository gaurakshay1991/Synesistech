name: Apply Synesis v5 Acceptance Fix

on:
  push:
    branches:
      - fix/acceptance-gate-v5
    paths:
      - '.github/workflows/apply-acceptance-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/acceptance-gate-v5
          fetch-depth: 0
      - name: Fix health identity and commit acceptance gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('model3/server/src/index.js')
          s = p.read_text()
          replacements = {
              "product: 'SYNESIS Neuro-Symbolic Legal Intelligence Platform',": "product: 'SYNESIS Live Legal Brain',",
              "version: '4.0.0',": "version: '5.0.0',",
              "category: 'Neuro-symbolic legal, regulatory, clause-memory and governed simulation platform',": "category: 'Live neuro-symbolic legal intelligence with autonomous source monitoring, current-law research, independent document analysis and exposure reasoning',",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected health metadata not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm -f .github/workflows/apply-acceptance-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Enforce Synesis v5 acceptance gate and correct health identity'
          git push origin HEAD:fix/acceptance-gate-v5
