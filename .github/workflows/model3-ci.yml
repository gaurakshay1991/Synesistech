name: SYNESIS MODEL 3 CI

on:
  push:
    branches:
      - synesis-new-model-3.0
    paths:
      - 'model3/**'
      - 'render.yaml'
      - '.circleci/config.yml'
      - '.github/workflows/model3-ci.yml'
  pull_request:
    branches:
      - synesis-new-model-3.0
    paths:
      - 'model3/**'
      - 'render.yaml'
      - '.circleci/config.yml'
      - '.github/workflows/model3-ci.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: model3
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: model3/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run regression tests and production build
        run: npm run check

      - name: Upload production frontend
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synesis-model3-frontend
          path: model3/client/dist
          if-no-files-found: error
          retention-days: 7
