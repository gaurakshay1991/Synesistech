name: Apply Current Law Everywhere

on:
  push:
    branches:
      - feature/current-law-everywhere-v5
    paths:
      - "model3/scripts/apply-current-law-everywhere.mjs"
      - ".github/workflows/apply-current-law-everywhere.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/current-law-everywhere-v5
          fetch-depth: 0
      - run: node model3/scripts/apply-current-law-everywhere.mjs
      - run: rm -f model3/scripts/apply-current-law-everywhere.mjs .github/workflows/apply-current-law-everywhere.yml
      - name: Commit current-law integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make fresh current-law research standard across Synesis"
          git push origin HEAD:feature/current-law-everywhere-v5
