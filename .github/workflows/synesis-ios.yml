name: SYNESIS iOS CI

on:
  push:
    branches:
      - feature/synesis-ios-v1
    paths:
      - 'mobile/**'
      - '.github/workflows/synesis-ios.yml'
  pull_request:
    branches:
      - synesis-new-model-3.0
    paths:
      - 'mobile/**'
      - '.github/workflows/synesis-ios.yml'

permissions:
  contents: read

jobs:
  ios-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Verify mobile product contract
        run: npm run check

      - name: Export iOS bundle
        run: npm run export:ios

      - name: Upload iOS export
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synesis-ios-export
          path: mobile/dist-ios
          if-no-files-found: error
          retention-days: 7
