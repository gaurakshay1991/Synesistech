name: Apply Synesis Live Legal Brain v5

on:
  push:
    branches:
      - feature/live-legal-brain-v5
    paths:
      - "model3/scripts/apply-live-v5.mjs"
      - ".github/workflows/apply-live-v5.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/live-legal-brain-v5
          fetch-depth: 0
      - name: Apply v5 integration
        run: node model3/scripts/apply-live-v5.mjs
      - name: Remove one-time patch machinery
        run: rm -f model3/scripts/apply-live-v5.mjs .github/workflows/apply-live-v5.yml
      - name: Commit integrated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate Synesis Live Legal Brain v5"
          git push origin HEAD:feature/live-legal-brain-v5
